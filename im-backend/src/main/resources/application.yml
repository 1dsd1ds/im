server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: im-backend
  datasource:
    url: jdbc:mysql://localhost:3306/company?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true
    username: root
    password: '@Xx1474558986'
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    cn.edu.zjut.im: DEBUG
    org.springframework.security: INFO

# JWT
jwt:
  secret: im-system-secret-key-2024-change-this-in-production
  expiration: 86400000
  token-header: Authorization
  token-prefix: "Bearer "
  refresh-expiration: 604800000
  enable-refresh-token: true
  allow-multi-device-login: true
  issuer: im-system
  audience: im-client

# Netty WebSocket
netty:
  port: 8090
  boss-threads: 1
  worker-threads: 4

# 上传配置
im:
  upload:
    dir: D:/实验/uploads
    url-prefix: /uploads
